name: Smart Inventory V2 Tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/smart-inventory-v2
    paths:
      - "v2/**"
      - ".github/workflows/v2-tests.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-tests.yml"

jobs:
  client-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run V2 tests
        run: npm test

  server-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm install --no-audit --no-fund

      - name: Check server JavaScript syntax
        run: find src scripts -name "*.js" -print0 | xargs -0 -n1 node --check
